<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Multiplayer</title>
    
    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --light: #f0d9b5;
            --dark: #b58863;
            --selected: #f6f669;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2b2b2b;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        #status-box {
            margin-bottom: 15px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        #status-text {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        #room-code-display {
            display: none;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 2px;
            margin: 10px 0;
            background: #222;
            padding: 10px;
            border-radius: 6px;
            border: 2px dashed #4CAF50;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid #5a3e2b;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
            opacity: 0.3;
            pointer-events: none;
            transition: 0.3s;
        }
        #board.active {
            opacity: 1;
            pointer-events: auto;
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            cursor: pointer;
            position: relative;
        }
        .square.light { background-color: var(--light); color: #000; }
        .square.dark { background-color: var(--dark); color: #000; }
        .square.selected { background-color: var(--selected) !important; }
        .square.valid-move::after {
            content: '';
            width: 16px;
            height: 16px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
        }
        .square.valid-capture::after {
            content: '';
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            box-sizing: border-box;
        }
        .square.check { box-shadow: inset 0 0 15px 5px red; }
        #controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        #join-room-input { width: 140px; text-transform: uppercase; text-align: center; }
        .error-msg {
            color: #ff5252;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<h1>♔ Xadrez Multiplayer ♚</h1>

<div id="status-box">
    <div id="status-text">Escolha uma opção abaixo para começar.</div>
    <div id="room-code-display">CÓDIGO DA SALA: <span id="room-code-value"></span></div>
    <div id="error-msg" class="error-msg"></div>
</div>

<div id="board"></div>

<div id="controls">
    <!-- Opção 1: Criar Sala -->
    <button id="create-btn">Criar Nova Sala (Brancas)</button>
    
    <!-- Opção 2: Entrar em Sala -->
    <div class="input-group">
        <input type="text" id="join-room-input" placeholder="CÓDIGO" maxlength="6">
        <button id="join-btn">Entrar na Sala (Pretas)</button>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURAÇÃO DO SUPABASE
    // ============================================
    const SUPABASE_URL = 'https://aiprlhinimcldpqgdxeu.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_qUb2dauA7EeKdfOfiOQFXA_w5mLlvk-'; 

    // Elementos da tela
    const boardElement = document.getElementById('board');
    const statusText = document.getElementById('status-text');
    const roomCodeDisplay = document.getElementById('room-code-display');
    const roomCodeValue = document.getElementById('room-code-value');
    const errorMsg = document.getElementById('error-msg');
    const createBtn = document.getElementById('create-btn');
    const joinBtn = document.getElementById('join-btn');
    const joinInput = document.getElementById('join-room-input');

    // Variáveis do Jogo
    let game = new Chess(); 
    let selectedSquare = null; 
    let supabaseClient = null;
    let channel = null;
    let myColor = null; 
    let myClientId = Math.random().toString(36).substring(2, 9); 

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const pieceSymbols = {
        'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
        'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    // ============================================
    // FUNÇÕES DE INTERFACE E TABULEIRO
    // ============================================
    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    function clearError() {
        errorMsg.style.display = 'none';
    }

    function initBoard() {
        boardElement.innerHTML = '';
        const board = game.board();
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const squareDiv = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                squareDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const squareName = files[col] + (8 - row); 
                squareDiv.dataset.square = squareName;
                
                const piece = board[row][col];
                if (piece) {
                    const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    squareDiv.textContent = pieceSymbols[symbolKey];
                }
                
                squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                boardElement.appendChild(squareDiv);
            }
        }
        highlightCheck();
    }

    function handleSquareClick(squareName) {
        if (game.game_over()) {
            statusText.textContent = 'Fim de jogo!';
            return;
        }

        if (game.turn() !== myColor) {
            statusText.textContent = `Aguarde... é a vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
            return;
        }

        const piece = game.get(squareName);

        if (selectedSquare) {
            const from = selectedSquare;
            const to = squareName;

            try {
                const move = game.move({ from: from, to: to, promotion: 'q' });
                if (move) {
                    if (channel) {
                        channel.send({
                            type: 'broadcast',
                            event: 'move',
                            payload: { from: from, to: to, promotion: move.promotion || 'q', sender: myClientId }
                        });
                    }
                    selectedSquare = null;
                    initBoard();
                    updateStatus();
                    return;
                }
            } catch (e) {}
            
            if (piece && piece.color === game.turn()) {
                selectPiece(squareName);
            } else {
                selectedSquare = null;
                initBoard();
            }
        } else {
            if (piece && piece.color === game.turn()) {
                if (piece.color !== myColor) {
                    statusText.textContent = 'Você não pode mover as peças do adversário!';
                    return;
                }
                selectPiece(squareName);
            }
        }
    }

    function selectPiece(squareName) {
        selectedSquare = squareName;
        document.querySelectorAll('.square').forEach(el => el.classList.remove('selected', 'valid-move', 'valid-capture'));
        const squareDiv = document.querySelector(`.square[data-square="${squareName}"]`);
        if (squareDiv) squareDiv.classList.add('selected');
        
        const moves = game.moves({ square: squareName, verbose: true });
        moves.forEach(m => {
            const targetDiv = document.querySelector(`.square[data-square="${m.to}"]`);
            if (targetDiv) {
                const isCapture = game.get(m.to) !== null;
                targetDiv.classList.add(isCapture ? 'valid-capture' : 'valid-move');
            }
        });
    }

    function updateStatus() {
        if (game.in_checkmate()) {
            statusText.textContent = `Xeque-mate! ${game.turn() === 'w' ? 'Pretas' : 'Brancas'} venceram.`;
        } else if (game.in_draw()) {
            statusText.textContent = 'Empate!';
        } else if (game.in_check()) {
            statusText.textContent = `Xeque! Vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
        } else {
            statusText.textContent = `Vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
        }
        
        if (myColor) {
            statusText.textContent += ` (Você é ${myColor === 'w' ? 'Brancas' : 'Pretas'})`;
        }
        highlightCheck();
    }

    function highlightCheck() {
        document.querySelectorAll('.square').forEach(el => el.classList.remove('check'));
        if (game.in_check()) {
            const board = game.board();
            const turn = game.turn();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.type === 'k' && p.color === turn) {
                        const sq = files[c] + (8 - r);
                        const el = document.querySelector(`.square[data-square="${sq}"]`);
                        if (el) el.classList.add('check');
                        return;
                    }
                }
            }
        }
    }

    // ============================================
    // CONEXÃO SUPABASE (CRIAR OU ENTRAR)
    // ============================================
    function conectarSala(codigoSala, corJogador) {
        clearError();
        createBtn.disabled = true;
        joinBtn.disabled = true;
        statusText.textContent = 'Conectando...';

        try {
            if (!window.supabase) throw new Error("Falha ao carregar a biblioteca. Atualize a página com Ctrl+F5.");

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const channelName = `chess-${codigoSala}`;
            
            channel = supabaseClient.channel(channelName, {
                config: { 
                    broadcast: { self: true, ack: true },
                    presence: { key: myClientId }
                } 
            });

            // Recebe os movimentos
            channel.on('broadcast', { event: 'move' }, (payload) => {
                const data = payload.payload;
                if (data.sender === myClientId) return;
                try {
                    game.move({ from: data.from, to: data.to, promotion: data.promotion || 'q' });
                    initBoard();
                    updateStatus();
                } catch (e) { console.error('Erro no movimento:', e); }
            });

            // Sincroniza quem está na sala
            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                const players = Object.keys(state);
                
                // Lógica de segurança: se o jogador 2 entrou, ele assume as Pretas
                if (players.length > 1 && corJogador === 'w') {
                     // Se por acaso dois tentarem ser brancos, um vira preto
                    myColor = players[0] === myClientId ? 'w' : 'b';
                } else {
                    myColor = corJogador;
                }
                
                boardElement.classList.add('active');
                updateStatus();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.track({ online_at: new Date().toISOString() });
                    roomCodeDisplay.style.display = 'block';
                    roomCodeValue.textContent = codigoSala;
                    statusText.textContent = `Conectado! Você é ${corJogador === 'w' ? 'Brancas' : 'Pretas'}.`;
                } else if (status === 'CHANNEL_ERROR') {
                    showError("Erro ao conectar no banco. Verifique o Supabase.");
                    createBtn.disabled = false;
                    joinBtn.disabled = false;
                }
            });

        } catch (error) {
            showError("Erro: " + error.message);
            createBtn.disabled = false;
            joinBtn.disabled = false;
        }
    }

    // ============================================
    // BOTÕES
    // ============================================
    createBtn.addEventListener('click', () => {
        // Gera um código de 6 caracteres
        const codigo = Math.random().toString(36).substring(2, 8).toUpperCase();
        conectarSala(codigo, 'w');
    });

    joinBtn.addEventListener('click', () => {
        const codigo = joinInput.value.trim().toUpperCase();
        if (codigo.length < 4) {
            showError("Digite um código válido.");
            return;
        }
        conectarSala(codigo, 'b');
    });

    // Inicializa o tabuleiro apagado na tela
    initBoard();
</script>
</body>
</html>

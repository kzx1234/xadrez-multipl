<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Multiplayer</title>
    <!-- chess.js: Biblioteca de regras oficiais do xadrez -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --light: #f0d9b5;
            --dark: #b58863;
            --selected: #f6f669;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2b2b2b;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        #status {
            margin-bottom: 15px;
            padding: 10px 20px;
            background: #444;
            border-radius: 8px;
            font-weight: bold;
            min-height: 24px;
            text-align: center;
            font-size: 18px;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 5px solid #5a3e2b;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }
        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            position: relative;
        }
        .square.light { background-color: var(--light); color: #000; }
        .square.dark { background-color: var(--dark); color: #000; }
        .square.selected { background-color: var(--selected) !important; }
        .square.valid-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
        }
        .square.valid-capture::after {
            content: '';
            width: 60px;
            height: 60px;
            border: 5px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            box-sizing: border-box;
        }
        .square.check { box-shadow: inset 0 0 20px 5px red; }
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        #room-input { width: 150px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h1>♔ Xadrez Multiplayer ♚</h1>
<div id="status">Configure a sala e conecte</div>
<div id="board" class="hidden"></div>

<div id="controls">
    <input type="text" id="room-input" placeholder="ID da Sala (ex: 123)" value="sala1">
    <button id="connect-btn">Conectar / Criar Sala</button>
    <button id="reset-btn" class="hidden">Nova Partida</button>
</div>

<script>
    // ============================================
    // CONFIGURAÇÃO DO SUPABASE
    // ============================================
    const SUPABASE_URL = 'https://aiprlhinimcldpqgdxeu.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_qUb2dauA7EeKdfOfiOQFXA_w5mLlvk-'; 

    let game = new Chess(); 
    let boardElement = document.getElementById('board');
    let statusElement = document.getElementById('status');
    let selectedSquare = null; 
    
    let supabase = null;
    let channel = null;
    let myColor = null; // Começa nulo, definido ao conectar
    let isMultiplayer = false;
    let roomId = '';
    let myClientId = Math.random().toString(36).substring(2, 9); 

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const pieceSymbols = {
        'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
        'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    // ============================================
    // INICIALIZAÇÃO DO TABULEIRO
    // ============================================
    function initBoard() {
        boardElement.innerHTML = '';
        const board = game.board();
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const squareDiv = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                squareDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                
                const squareName = files[col] + (8 - row); 
                squareDiv.dataset.square = squareName;
                
                const piece = board[row][col];
                if (piece) {
                    const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    squareDiv.textContent = pieceSymbols[symbolKey];
                }
                
                squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                boardElement.appendChild(squareDiv);
            }
        }
        highlightCheck();
    }

    // ============================================
    // LÓGICA DE MOVIMENTO
    // ============================================
    function handleSquareClick(squareName) {
        if (game.game_over()) {
            statusElement.textContent = 'Fim de jogo! Reinicie.';
            return;
        }

        if (isMultiplayer && game.turn() !== myColor) {
            statusElement.textContent = `Aguarde... é a vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
            return;
        }

        const piece = game.get(squareName);

        if (selectedSquare) {
            const from = selectedSquare;
            const to = squareName;

            try {
                const move = game.move({ from: from, to: to, promotion: 'q' });
                if (move) {
                    if (isMultiplayer && channel) {
                        channel.send({
                            type: 'broadcast',
                            event: 'move',
                            payload: { from: from, to: to, promotion: move.promotion || 'q', sender: myClientId }
                        });
                    }
                    selectedSquare = null;
                    initBoard();
                    updateStatus();
                    return;
                }
            } catch (e) {
                // Movimento inválido, trata abaixo
            }
            
            // Se chegou aqui, o movimento falhou ou clicou em outra peça
            if (piece && piece.color === game.turn()) {
                selectPiece(squareName);
            } else {
                selectedSquare = null;
                initBoard();
            }
        } else {
            if (piece && piece.color === game.turn()) {
                if (isMultiplayer && piece.color !== myColor) {
                    statusElement.textContent = 'Você não pode mover as peças do adversário!';
                    return;
                }
                selectPiece(squareName);
            }
        }
    }

    function selectPiece(squareName) {
        selectedSquare = squareName;
        document.querySelectorAll('.square').forEach(el => el.classList.remove('selected', 'valid-move', 'valid-capture'));
        const squareDiv = document.querySelector(`.square[data-square="${squareName}"]`);
        if (squareDiv) squareDiv.classList.add('selected');
        
        const moves = game.moves({ square: squareName, verbose: true });
        moves.forEach(m => {
            const targetDiv = document.querySelector(`.square[data-square="${m.to}"]`);
            if (targetDiv) {
                const isCapture = game.get(m.to) !== null;
                targetDiv.classList.add(isCapture ? 'valid-capture' : 'valid-move');
            }
        });
    }

    function updateStatus() {
        if (game.in_checkmate()) {
            statusElement.textContent = `Xeque-mate! ${game.turn() === 'w' ? 'Pretas' : 'Brancas'} venceram.`;
        } else if (game.in_draw()) {
            statusElement.textContent = 'Empate!';
        } else if (game.in_check()) {
            statusElement.textContent = `Xeque! Vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
        } else {
            statusElement.textContent = `Vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
        }
        
        if (isMultiplayer) {
            statusElement.textContent += ` (Você é ${myColor === 'w' ? 'Brancas' : 'Pretas'})`;
        }
        highlightCheck();
    }

    function highlightCheck() {
        document.querySelectorAll('.square').forEach(el => el.classList.remove('check'));
        if (game.in_check()) {
            const board = game.board();
            const turn = game.turn();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.type === 'k' && p.color === turn) {
                        const sq = files[c] + (8 - r);
                        const el = document.querySelector(`.square[data-square="${sq}"]`);
                        if (el) el.classList.add('check');
                        return;
                    }
                }
            }
        }
    }

    // ============================================
    // SUPABASE MULTIPLAYER (CORRIGIDO COM PRESENCE)
    // ============================================
    async function connectToRoom() {
        const inputRoom = document.getElementById('room-input').value.trim();
        if (!inputRoom) return alert('Digite um ID de sala.');
        
        roomId = inputRoom;
        isMultiplayer = true;
        
        document.getElementById('connect-btn').disabled = true;
        statusElement.textContent = 'Conectando ao Supabase...';

        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const channelName = `chess-room-${roomId}`;
            
            channel = supabase.channel(channelName, {
                config: { 
                    broadcast: { self: true, ack: true },
                    presence: { key: myClientId }
                } 
            });

            // Escuta movimentos
            channel.on('broadcast', { event: 'move' }, (payload) => {
                const data = payload.payload;
                if (data.sender === myClientId) return;
                
                try {
                    game.move({ from: data.from, to: data.to, promotion: data.promotion || 'q' });
                    initBoard();
                    updateStatus();
                } catch (e) {
                    console.error('Movimento remoto inválido:', e);
                }
            });

            // Sincroniza jogadores na sala para definir quem é Branco e quem é Preto
            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                const players = Object.keys(state);
                
                // Se eu sou o primeiro na lista, sou branco. Se sou o segundo, sou preto.
                if (players.length > 0) {
                    if (players[0] === myClientId) {
                        myColor = 'w';
                    } else {
                        myColor = 'b';
                    }
                } else {
                    myColor = 'w';
                }
                
                boardElement.classList.remove('hidden');
                document.getElementById('reset-btn').classList.remove('hidden');
                updateStatus();
            });

            // Entra no canal e anuncia presença
            await channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.track({ online_at: new Date().toISOString() });
                    statusElement.textContent = `Conectado à sala "${roomId}".`;
                }
            });

        } catch (error) {
            console.error(error);
            statusElement.textContent = 'Erro ao conectar: ' + error.message;
            document.getElementById('connect-btn').disabled = false;
        }
    }

    document.getElementById('connect-btn').addEventListener('click', connectToRoom);
    document.getElementById('reset-btn').addEventListener('click', () => {
        if (isMultiplayer && !confirm('Reiniciar a partida localmente?')) return;
        game = new Chess();
        selectedSquare = null;
        initBoard();
        updateStatus();
    });

    // Inicializa vazio até conectar
    initBoard();
</script>
</body>
</html>

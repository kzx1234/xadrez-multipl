<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Multiplayer</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: sans-serif; background: #2b2b2b; color: #fff; text-align: center; padding: 20px; }
        #board { display: grid; grid-template-columns: repeat(8, 50px); gap: 0; margin: 20px auto; border: 5px solid #5a3e2b; width: max-content; opacity: 0.3; pointer-events: none; }
        #board.active { opacity: 1; pointer-events: auto; }
        .square { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 35px; cursor: pointer; }
        .light { background-color: #f0d9b5; color: #000; }
        .dark { background-color: #b58863; color: #000; }
        .selected { background-color: #f6f669 !important; }
        .valid-move::after { content: ''; width: 15px; height: 15px; background: rgba(0,0,0,0.2); border-radius: 50%; position: absolute; }
        button, input { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #4CAF50; color: white; cursor: pointer; }
        button:disabled { background: #666; }
        #error-box { color: #ff5252; font-weight: bold; margin-top: 10px; height: 20px; }
    </style>
</head>
<body>

<h1>♔ Xadrez Multiplayer ♚</h1>

<div id="error-box"></div>
<div id="status">Escolha uma opção abaixo.</div>

<button id="create-btn">Criar Nova Sala (Brancas)</button>
<input type="text" id="join-input" placeholder="CÓDIGO DA SALA" maxlength="6" style="text-transform: uppercase;">
<button id="join-btn">Entrar (Pretas)</button>

<div id="board"></div>

<script>
    // Avisa que o script começou a rodar
    console.log("Script iniciado!");

    // ============================================
    // SUAS CHAVES (CONFIRA SE ESTÃO EXATAMENTE ASSIM)
    // ============================================
    const SUPABASE_URL = 'https://aiprlhinimcldpqgdxeu.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_qUb2dauA7EeKdfOfiOQFXA_w5mLlvk-'; 

    let game = new Chess(); 
    let boardEl = document.getElementById('board');
    let statusEl = document.getElementById('status');
    let errorEl = document.getElementById('error-box');
    let selectedSquare = null; 
    let supabaseClient = null;
    let channel = null;
    let myColor = null; 
    let myId = Math.random().toString(36).substring(2, 9); 

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const symbols = { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔' };

    function initBoard() {
        boardEl.innerHTML = '';
        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                let div = document.createElement('div');
                div.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                let sq = files[c] + (8 - r);
                div.dataset.sq = sq;
                let p = board[r][c];
                if (p) div.textContent = symbols[p.color === 'w' ? p.type.toUpperCase() : p.type];
                div.onclick = () => handleClick(sq);
                boardEl.appendChild(div);
            }
        }
    }

    function handleClick(sq) {
        if (!myColor) return alert("Você ainda não está conectado a uma sala!");
        if (game.turn() !== myColor) return alert(`Aguarde, é a vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}!`);

        const p = game.get(sq);
        if (selectedSquare) {
            try {
                let move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
                if (move) {
                    if (channel) channel.send({ type: 'broadcast', event: 'move', payload: { from: selectedSquare, to: sq, sender: myId } });
                    selectedSquare = null;
                    initBoard();
                    updateStatus();
                    return;
                }
            } catch (e) {}
            
            if (p && p.color === game.turn()) {
                selectedSquare = sq;
            } else {
                selectedSquare = null;
            }
            initBoard();
            if (selectedSquare) {
                document.querySelector(`[data-sq="${selectedSquare}"]`).classList.add('selected');
                game.moves({ square: selectedSquare, verbose: true }).forEach(m => {
                    let el = document.querySelector(`[data-sq="${m.to}"]`);
                    if (el) el.classList.add('valid-move');
                });
            }
        } else {
            if (p && p.color === game.turn()) {
                selectedSquare = sq;
                initBoard();
                document.querySelector(`[data-sq="${selectedSquare}"]`).classList.add('selected');
                game.moves({ square: selectedSquare, verbose: true }).forEach(m => {
                    let el = document.querySelector(`[data-sq="${m.to}"]`);
                    if (el) el.classList.add('valid-move');
                });
            }
        }
    }

    function updateStatus() {
        if (game.in_checkmate()) statusEl.textContent = `Xeque-mate! ${game.turn() === 'w' ? 'Pretas' : 'Brancas'} venceram.`;
        else if (game.in_draw()) statusEl.textContent = 'Empate!';
        else if (game.in_check()) statusEl.textContent = `Xeque!`;
        else statusEl.textContent = `Vez das ${game.turn() === 'w' ? 'brancas' : 'pretas'}.`;
        if (myColor) statusEl.textContent += ` (Você: ${myColor === 'w' ? 'Brancas' : 'Pretas'})`;
    }

    // ============================================
    // CONEXÃO
    // ============================================
    function conectar(codigo, cor) {
        errorEl.textContent = "";
        document.getElementById('create-btn').disabled = true;
        document.getElementById('join-btn').disabled = true;
        statusEl.textContent = "Conectando...";

        if (typeof window.supabase === 'undefined') {
            alert("ERRO FATAL: A biblioteca do Supabase não carregou. O seu navegador ou rede está bloqueando o script.");
            return;
        }

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            channel = supabaseClient.channel(`chess-${codigo}`, {
                config: { broadcast: { self: true }, presence: { key: myId } }
            });

            channel.on('broadcast', { event: 'move' }, (payload) => {
                if (payload.payload.sender === myId) return;
                try {
                    game.move({ from: payload.payload.from, to: payload.payload.to, promotion: 'q' });
                    initBoard();
                    updateStatus();
                } catch (e) { console.error(e); }
            });

            channel.on('presence', { event: 'sync' }, () => {
                let players = Object.keys(channel.presenceState());
                if (players.length > 1 && cor === 'w') myColor = players[0] === myId ? 'w' : 'b';
                else myColor = cor;
                
                boardEl.classList.add('active');
                statusEl.textContent = `Conectado à sala ${codigo}. Você é ${myColor === 'w' ? 'Brancas' : 'Pretas'}.`;
                updateStatus();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.track({ online_at: new Date().toISOString() });
                } else if (status === 'CHANNEL_ERROR') {
                    alert("Erro de conexão com o Supabase. Verifique se o Realtime está ativado no painel.");
                    errorEl.textContent = "Erro de conexão.";
                }
            });

        } catch (err) {
            alert("Erro ao conectar: " + err.message);
            document.getElementById('create-btn').disabled = false;
            document.getElementById('join-btn').disabled = false;
        }
    }

    // ============================================
    // EVENTOS DOS BOTÕES
    // ============================================
    document.getElementById('create-btn').onclick = function() {
        alert("Botão Criar clicado! Gerando sala...");
        let cod = Math.random().toString(36).substring(2, 8).toUpperCase();
        conectar(cod, 'w');
    };

    document.getElementById('join-btn').onclick = function() {
        let cod = document.getElementById('join-input').value.trim().toUpperCase();
        if (cod.length < 4) return alert("Digite um código válido!");
        alert("Botão Entrar clicado! Conectando à sala " + cod);
        conectar(cod, 'b');
    };

    initBoard();
</script>
</body>
</html>
